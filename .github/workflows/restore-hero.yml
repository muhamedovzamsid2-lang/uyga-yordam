name: Restore original UYGA YORDAM landing design

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore-design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore original landing design
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Keep all existing application logic, authentication, order modal,
          # worker/admin sections and APIs. Replace only the public home view
          # with the original UYGA YORDAM promotional design asset.
          home = '''<section id="home" class="promo-home">
            <div class="promo-art">
              <img src="hero.png" alt="UYGA YORDAM — хизматлар платформаси">
              <button class="promo-hotspot promo-main-order" type="button" aria-label="Буюртма бериш" onclick="openOrder()"></button>
              <button class="promo-hotspot promo-phone-order" type="button" aria-label="Буюртма бериш" onclick="openOrder()"></button>
              <button class="promo-hotspot promo-bottom-order" type="button" aria-label="Буюртма бериш" onclick="openOrder()"></button>
            </div>
            <div id="services" class="hidden"></div>
          </section>'''

          pattern = r'<section id="home"[\s\S]*?</section>'
          ns, n = re.subn(pattern, home, s, count=1)
          if n != 1:
              raise SystemExit('home section not found')

          css = '''

/* Original UYGA YORDAM landing design */
.promo-home{margin:0 -5%}
.promo-art{position:relative;width:100%;line-height:0;overflow:hidden}
.promo-art>img{display:block;width:100%;height:auto;margin:0;border-radius:0;box-shadow:none}
.promo-hotspot{position:absolute;display:block;padding:0;margin:0;border:0;background:transparent;cursor:pointer;z-index:2}
.promo-hotspot:focus-visible{outline:3px solid #12a58c;outline-offset:2px;border-radius:18px}
.promo-main-order{left:2.2%;top:30.5%;width:18.0%;height:4.2%}
.promo-phone-order{left:75.5%;top:16.0%;width:10.8%;height:3.5%}
.promo-bottom-order{left:68.2%;top:88.0%;width:18.2%;height:4.2%}
@media(max-width:700px){
  .promo-home{margin:0 -5%}
  .promo-main-order{left:2%;top:30.5%;width:18%;height:4.2%}
  .promo-phone-order{left:75%;top:16%;width:12%;height:4%}
  .promo-bottom-order{left:68%;top:88%;width:19%;height:4.5%}
}
'''
          if '/* Original UYGA YORDAM landing design */' not in ns:
              ns = ns.replace('</style>', css + '</style>', 1)

          p.write_text(ns, encoding='utf-8')
          PY
      - name: Commit restored design
        run: |
          if git diff --quiet -- index.html; then
            echo "Original landing design already restored"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restore original UYGA YORDAM landing design"
          git push
