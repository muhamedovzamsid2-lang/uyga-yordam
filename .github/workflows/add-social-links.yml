name: Fix social media links

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-social-links:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix social media block
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          css = '''
          .social-links{
            position:relative;
            z-index:100;
            margin:30px 0 130px;
            padding-bottom:20px;
            display:grid;
            grid-template-columns:repeat(4,1fr);
            gap:12px;
          }
          .social-link{
            position:relative;
            z-index:101;
            display:flex;
            align-items:center;
            justify-content:center;
            gap:8px;
            min-height:52px;
            padding:12px 14px;
            border:1px solid var(--line);
            border-radius:16px;
            background:#fff;
            color:var(--ink);
            text-decoration:none;
            font-weight:800;
            box-shadow:0 8px 25px #103d3710;
            transition:transform .15s ease,box-shadow .15s ease;
            pointer-events:auto;
          }
          .social-link:hover{
            transform:translateY(-2px);
            box-shadow:0 12px 30px #103d3718;
          }
          @media(max-width:850px){
            .social-links{grid-template-columns:repeat(2,1fr);margin-bottom:140px}
          }
          @media(max-width:520px){
            .social-links{grid-template-columns:1fr;margin-bottom:150px}
          }
          '''

          if '</style>' not in text:
              raise SystemExit('Expected </style> marker was not found')

          text = re.sub(r'\n\s*\.social-links\s*\{.*?\n\s*@media\(max-width:520px\)\{\s*\.social-links\{grid-template-columns:1fr\}\s*\}\s*', '\n', text, count=1, flags=re.S)
          text = text.replace('</style>', css + '\n</style>', 1)

          text = text.replace('href="https://www.tiktok.com/@uygayordam"', 'href="https://www.tiktok.com/@uygayordam?lang=en"')
          text = text.replace('href="https://tiktok.com/@uygayordam"', 'href="https://www.tiktok.com/@uygayordam?lang=en"')

          path.write_text(text, encoding='utf-8')
          print('Social media visibility and TikTok link fixed.')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix social links visibility and TikTok"
          git push
